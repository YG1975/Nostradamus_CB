<svg width="680" height="436" viewBox="0 0 680 436" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Open Data Cube deployment architecture</title>
<desc>Product definitions and dataset documents feed into datacube-core, which indexes them into a PostgreSQL/PostGIS database. The Python API, ODC Explorer, and OGC web services all read from that same index.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="110" y="30" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="215" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Product definitions</text>
<text x="215" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Describe a data type</text>

<rect x="360" y="30" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="465" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Dataset documents</text>
<text x="465" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Describe each dataset</text>

<line x1="215" y1="86" x2="280" y2="128" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="465" y1="86" x2="400" y2="128" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="240" y="130" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">datacube-core</text>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Indexes and manages data</text>

<line x1="340" y1="186" x2="340" y2="228" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="210" y="230" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">PostgreSQL/PostGIS index</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">What, where, when</text>

<line x1="260" y1="286" x2="156" y2="338" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="286" x2="340" y2="338" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="286" x2="524" y2="338" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="76" y="340" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="156" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Python API</text>
<text x="156" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Query in code</text>

<rect x="260" y="340" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">ODC Explorer</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Browse online</text>

<rect x="444" y="340" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="524" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">OGC services</text>
<text x="524" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">WMS / WCS access</text>
</svg>
